<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="viewer-static.min.js"></script>
<style>
  body { margin: 0; background: #ffffff; }
  .mxgraph-holder { background: #ffffff; }
  #err { white-space: pre-wrap; color: #c0392b; font: 13px/1.4 sans-serif; padding: 8px; }
</style>
</head>
<body>
<script>
(function () {
  function fail(message) {
    try { parent.postMessage({ type: "drawio-error", message: String(message) }, "*"); } catch {}
  }
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object" || d.type !== "drawio-render") return;
    try {
      document.body.innerHTML = "";
      var div = document.createElement("div");
      div.className = "mxgraph";
      div.setAttribute("data-mxgraph", JSON.stringify({
        xml: d.xml, highlight: "#0000ff", nav: true, resize: true, "dark-mode": "auto",
        toolbar: "zoom layers tags lightbox", "check-visible-state": false,
        "auto-fit": true, "toolbar-nohide": true, edit: "_blank"
      }));
      document.body.appendChild(div);
      if (typeof GraphViewer === "undefined") throw new Error("GraphViewer failed to load");
      GraphViewer.createViewerForElement(div);
      setTimeout(function () {
        parent.postMessage({ type: "drawio-rendered", height: Math.max(120, document.body.scrollHeight) }, "*");
      }, 80);
    } catch (err) {
      document.body.innerHTML = "";
      var pre = document.createElement("pre");
      pre.id = "err";
      pre.textContent = String((err && err.message) || err);
      document.body.appendChild(pre);
      fail(err);
    }
  });
  parent.postMessage({ type: "drawio-ready" }, "*");
})();
</script>
</body>
</html>
